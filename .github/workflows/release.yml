name: Release

# Tag-driven release pipeline. Push a version tag and this builds all four
# platform/architecture targets (on free GitHub-hosted runners) and assembles
# a DRAFT GitHub release with the binaries
# attached, named gjoa-<version>-<platform>.<ext>. The draft is deliberate: a human
# reviews the generated release notes and clicks Publish — CI never publishes on its own.
#
#   git tag v0.4.1 && git push origin v0.4.1
#
# The three build-*.yml workflows are reused (workflow_call), so the build steps
# stay defined in exactly one place.

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag matches gjoa.json
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be v-prefixed semantic version, got $GITHUB_REF_NAME"
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          config_version="$(jq -r '.displayVersion' gjoa.json)"
          if [[ "$tag_version" != "$config_version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match gjoa.json displayVersion $config_version"
            exit 1
          fi
          echo "validated $GITHUB_REF_NAME against gjoa.json"

  # Releases build on the free GitHub-hosted runners (slower, but no Blacksmith
  # credits consumed). Flip `fast: true` per job to opt a release back onto
  # Blacksmith if credits are available and the speed is worth it.
  linux:
    needs: validate
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: x86_64
  linux-arm64:
    needs: validate
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: aarch64
  macos:
    needs: validate
    uses: ./.github/workflows/build-macos.yml
  windows:
    needs: validate
    uses: ./.github/workflows/build-windows.yml

  release:
    needs: [linux, linux-arm64, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version: $VER"
          mkdir -p release
          find artifacts/gjoa-linux-x86_64   -name '*.tar.xz'   -exec cp {} "release/gjoa-${VER}-linux-x86_64.tar.xz" \;
          find artifacts/gjoa-linux-x86_64   -name '*.AppImage' -exec cp {} "release/gjoa-${VER}-x86_64.AppImage" \;
          find artifacts/gjoa-linux-aarch64  -name '*.tar.xz'   -exec cp {} "release/gjoa-${VER}-linux-aarch64.tar.xz" \;
          find artifacts/gjoa-linux-aarch64  -name '*.AppImage' -exec cp {} "release/gjoa-${VER}-aarch64.AppImage" \;
          find artifacts/gjoa-macos-arm64     -name '*.dmg'      -exec cp {} "release/gjoa-${VER}-macos-arm64.dmg" \;
          find artifacts/gjoa-windows-x86_64  -name '*.win64.zip' -exec cp {} "release/gjoa-${VER}-windows-x86_64.zip" \;
          echo "=== assembled ==="
          ls -la release/
          # Fail loudly if any platform asset is missing or trivially small.
          n=$(find release -type f | wc -l)
          small=$(find release -type f -size -1M | wc -l)
          if [ "$n" -ne 6 ] || [ "$small" -ne 0 ]; then
            echo "::error::expected 6 non-trivial assets, got $n ($small under 1MB)"; exit 1
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
