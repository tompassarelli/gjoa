name: Linux build

on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Use the Blacksmith fast runner (paid) instead of free GitHub-hosted"
        type: boolean
        default: false
      arch:
        description: "Target architecture"
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
  workflow_call:
    inputs:
      fast:
        type: boolean
        default: false
      arch:
        type: string
        default: x86_64

jobs:
  build:
    # ubuntu-24.04-arm is GitHub's standard ARM64 runner. It is free for this
    # public repository; the Blacksmith fast runner is x86_64-only here.
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || (inputs.fast && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04') }}
    timeout-minutes: 300
    env:
      FF_VERSION: "153.0.1"
      APPIMAGETOOL_VERSION: "1.9.1"
      APPIMAGE_RUNTIME_VERSION: "20251108"
      # Pinned beagle worktree: the build tooling (.bjs + package.json) resolves
      # beagle-build / beagle from $BEAGLE_PIN_ROOT (default ~/code/beagle-pin).
      # CI clones the pin SHA into ../beagle and points the build at it, so the
      # compile is DETERMINISTIC against configs/beagle.ref, not the moving HEAD.
      BEAGLE_PIN_ROOT: ${{ github.workspace }}/../beagle
    steps:
      - uses: actions/checkout@v4

      # Firefox's objdir is ~30GB; the runner ships ~14GB free on /. The Jun-13
      # build stalled 34 min then SIGTERM (143) — disk exhaustion. Reclaim ~25GB
      # of preinstalled toolchains we don't use before anything else.
      - name: Free disk space
        if: ${{ inputs.arch == 'aarch64' || !inputs.fast }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /usr/share/swift "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgtk-3-dev libdbus-glib-1-dev \
            libpulse-dev libasound2-dev libxt-dev \
            libx11-xcb-dev libxcomposite-dev libxdamage-dev \
            libxrandr-dev libxcursor-dev libxi-dev \
            libcups2-dev libdrm-dev \
            nasm yasm m4 unzip zip \
            python3 python3-pip \
            mercurial pkg-config nodejs desktop-file-utils

      - name: Maximize build space
        if: ${{ inputs.arch == 'aarch64' || !inputs.fast }}
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Download Firefox source
        run: |
          mkdir -p ~/.cache/gjoa/sources
          curl -L -o ~/.cache/gjoa/sources/firefox-${FF_VERSION}.source.tar.xz \
            "https://archive.mozilla.org/pub/firefox/releases/${FF_VERSION}/source/firefox-${FF_VERSION}.source.tar.xz"
          ls -lh ~/.cache/gjoa/sources/firefox-${FF_VERSION}.source.tar.xz

      # F9 hardening: verify the downloaded tarball against the IN-REPO pinned
      # SHA-256 (configs/firefox-${FF_VERSION}.sha256) BEFORE extracting. The
      # pin is committed + reviewed, so unlike a same-origin SHA256SUMS it can't
      # be swapped by an origin/TLS compromise. Compare the computed hash to the
      # pinned value (first field of the pin file) — path-independent.
      - name: Verify tarball checksum (pinned)
        run: |
          PIN="configs/firefox-${FF_VERSION}.sha256"
          test -f "$PIN" || { echo "missing pinned checksum: $PIN"; exit 1; }
          expected=$(grep -v '^#' "$PIN" | awk 'NF{print $1; exit}')
          actual=$(sha256sum ~/.cache/gjoa/sources/firefox-${FF_VERSION}.source.tar.xz | awk '{print $1}')
          echo "expected: $expected"
          echo "actual:   $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Firefox tarball SHA-256 does not match pinned value in $PIN"
            exit 1
          fi
          echo "tarball checksum OK (matches pinned $PIN)"

      - name: Extract source
        run: |
          mkdir -p engine
          tar -xJf ~/.cache/gjoa/sources/firefox-${FF_VERSION}.source.tar.xz -C engine --strip-components=1

      # gjoa's build tooling is written in beagle (a Racket compiler), invoked
      # as a sibling at ../beagle. CI only checks out gjoa, so without these two
      # steps `bun run import` dies with "../beagle/bin/beagle-build: No such
      # file or directory" (exit 127). beagle-build runs standalone with just
      # Racket + the repo (no raco-pkg-install / direnv setup needed).
      - name: Install Racket (beagle compiler runtime)
        uses: Bogdanp/setup-racket@v1.15
        with:
          # #143: pin to the local reference Racket (v9.2). 'stable' is a MOVING
          # target — a different Racket emits different beagle JS for the SAME
          # pinned beagle SHA, which skewed CI's chrome bundles vs local
          # (gjoa-tabs.uc.js byte size != local). Deterministic emit needs the
          # same compiler RUNTIME, not just the same compiler source.
          version: '9.2'
          architecture: ${{ inputs.arch == 'aarch64' && 'arm64' || 'x64' }}
      - name: Checkout beagle (sibling compiler, pinned to configs/beagle.ref)
        run: |
          PIN="$(grep -vE '^\s*#' configs/beagle.ref | grep -vE '^\s*$' | head -1 | tr -d '[:space:]')"
          echo "Pinning beagle to $PIN"
          git clone --no-checkout --filter=blob:none https://github.com/tompassarelli/beagle.git ../beagle
          git -C ../beagle fetch --depth 1 origin "$PIN"
          git -C ../beagle checkout FETCH_HEAD
          echo "beagle now at $(git -C ../beagle rev-parse HEAD)"
      # beagle-build resolves modules from the 'beagle' Racket collection, which
      # is provided by beagle-lib (info.rkt: collection "beagle", deps just base).
      # Register it as a linked package so `(require beagle/...)` resolves.
      - name: Register beagle collection
        run: raco pkg install --link --batch --no-docs ../beagle/beagle-lib

      - name: Link beagle runtime for bun tooling (pinned)
        # Compiled .bjs tooling imports the $$bc runtime as `beagle/core.js`; bun
        # resolves it via node_modules/beagle. Point it at the pinned beagle
        # checkout. MUST run after the beagle checkout — `bun install` earlier
        # can't see ../beagle yet.
        run: |
          mkdir -p node_modules
          ln -sfn "$BEAGLE_PIN_ROOT/beagle-lib/lib/beagle" node_modules/beagle
          echo "node_modules/beagle -> $(readlink node_modules/beagle)"

      - name: Apply overlays and patches
        run: bun run import

      - name: Verify generated chrome smoke
        run: |
          node --check .beagle-tools/gjoa/tests/integration/smoke.js
          bun -e 'import {tests} from "./.beagle-tools/gjoa/tests/integration/smoke.js"; const mn={setContext:async()=>{},executeScript:async()=>true}; await tests[0].run(mn,{}); console.log("generated chrome smoke: pass")'

      - name: Verify JS projector + claim-docs
        run: |
          bun run projector:test || {
            echo "::group::projector failure diagnostics — which emitted bundle has the bad char"
            for f in dist/chrome/JS/*.uc.js; do echo "-- $f --"; node --check "$f" 2>&1 | head -3 || true; done
            echo "--- grep @ ---"; grep -n '@' dist/chrome/JS/*.uc.js | head -40 || true
            echo "--- locale ---"; locale 2>&1 | head -3 || true
            echo "::endgroup::"
            exit 1
          }

      - name: Write mozconfig
        run: |
          cat > engine/mozconfig <<'MOZCONFIG'
          ac_add_options --with-branding=browser/branding/gjoa
          ac_add_options --with-distribution-id=org.gjoa
          ac_add_options --with-app-name=gjoa
          ac_add_options --with-app-basename=Gjoa
          ac_add_options --without-wasm-sandboxed-libraries
          ac_add_options --disable-updater
          ac_add_options --disable-tests
          ac_add_options --enable-optimize
          ac_add_options --enable-release
          # Debug symbols dominate link-time RAM, objdir size, and final binary
          # size. A distribution build doesn't need them — dropping them is what
          # keeps the link inside the runner's memory + disk envelope. (lld is the
          # toolchain's default linker on clang/Linux, so it's used without a flag.)
          ac_add_options --disable-debug-symbols
          MOZCONFIG
          sed -i 's/^          //' engine/mozconfig
          cat engine/mozconfig

      - name: Bootstrap mach
        working-directory: engine
        run: |
          export MOZBUILD_STATE_PATH="$HOME/.mozbuild"
          echo 1 | ./mach bootstrap --application-choice=browser 2>&1 || true

      - name: Build
        working-directory: engine
        run: ./mach build -j${{ inputs.arch == 'x86_64' && inputs.fast && '16' || '2' }}

      - name: Verify binary architecture
        run: |
          GJOA_BIN="$(find "$PWD/engine"/obj-*/dist/bin/gjoa -type f -print -quit)"
          test -n "$GJOA_BIN"
          MOZ_OBJDIR="$(dirname "$(dirname "$(dirname "$GJOA_BIN")")")"
          test -d "$MOZ_OBJDIR/dist/bin"
          echo "MOZ_OBJDIR=$MOZ_OBJDIR" >> "$GITHUB_ENV"
          case "${{ inputs.arch }}" in
            x86_64) expected='x86-64' ;;
            aarch64) expected='aarch64' ;;
            *) echo "::error::unsupported architecture: ${{ inputs.arch }}"; exit 1 ;;
          esac
          file "$GJOA_BIN"
          file "$GJOA_BIN" | grep -qi "$expected"

      # Chrome-init smoke — FATAL. The single fastest signal that the bake produced
      # working gjoa chrome: asserts window.gjoaTest + window.Spaces initialize. A
      # beagle value-semantics / packaging regression (unresolvable $$bc import, or
      # $$bc undefined in a userscript bundle) silently kills ALL gjoa chrome in the
      # bake; without this gate CI would go green on a chrome-dead binary (it cost a
      # whole session 2026-06-21). No `|| true`: if chrome is dead, the build is red.
      - name: Chrome-init smoke (FATAL)
        run: |
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          GJOA_BIN="$(find "$PWD/engine"/obj-*/dist/bin/gjoa -type f -print -quit)"
          test -n "$GJOA_BIN"
          GJOA_BIN="$GJOA_BIN" \
            timeout 180 xvfb-run -a bun run _itest -- --grep "smoke: gjoa chrome"

      # Dark-mode contrast verification — runs the WCAG-AA harness against the
      # freshly-built binary in a clean xvfb env (the agent shell can't launch the
      # browser). NON-FATAL + time-bounded: baselines are record-only and an infra
      # hiccup must never red the build; the per-fixture scores land in the
      # uploaded contrast-results.log regardless.
      - name: Dark-mode contrast verification (non-fatal)
        run: |
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          bun tools/test-driver/contrast-fixture-server.mjs > /tmp/fix.log 2>&1 &
          sleep 2
          GJOA_BIN="$(find "$PWD/engine"/obj-*/dist/bin/gjoa -type f -print -quit)"
          test -n "$GJOA_BIN"
          GJOA_BIN="$GJOA_BIN" \
            timeout 600 xvfb-run -a bun run test:contrast > contrast-results.log 2>&1 || true
          echo "=== dark-mode contrast scores ==="
          grep "\[contrast\]" contrast-results.log || echo "(no scores captured — see contrast-results.log artifact)"

      - name: Upload contrast results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-results-${{ inputs.arch }}
          path: contrast-results.log
          if-no-files-found: warn

      - name: Package
        working-directory: engine
        run: ./mach package

      # The Firefox package is already a portable, self-contained application
      # tree. AppImage wraps that same tree without rewriting its libraries.
      # Both appimagetool and the embedded runtime are immutable releases with
      # pinned checksums; --runtime-file prevents appimagetool from fetching its
      # default runtime from the moving "continuous" release.
      - name: Build AppImage
        run: |
          case "${{ inputs.arch }}" in
            x86_64)
              expected_arch='x86-64'
              tool_sha='ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
              runtime_sha='2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'
              ;;
            aarch64)
              expected_arch='aarch64'
              tool_sha='f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158'
              runtime_sha='00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444'
              ;;
            *)
              echo "::error::unsupported AppImage architecture: ${{ inputs.arch }}"
              exit 1
              ;;
          esac

          package="$(find "$PWD"/engine/obj-*/dist -maxdepth 1 -name 'gjoa-*.tar.xz' -type f -print -quit)"
          test -n "$package"

          appdir="$RUNNER_TEMP/Gjoa.AppDir"
          tools_dir="$RUNNER_TEMP/appimage-tools"
          output_dir="$PWD/dist-packages"
          mkdir -p \
            "$appdir/usr/bin" \
            "$appdir/usr/lib/gjoa" \
            "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/256x256/apps" \
            "$appdir/usr/share/doc/gjoa" \
            "$tools_dir" \
            "$output_dir"

          tar -xJf "$package" -C "$appdir/usr/lib/gjoa" --strip-components=1
          test -x "$appdir/usr/lib/gjoa/gjoa"
          file "$appdir/usr/lib/gjoa/gjoa" | grep -qi "$expected_arch"
          install -Dm644 configs/branding/gjoa/logo256.png \
            "$appdir/usr/share/icons/hicolor/256x256/apps/gjoa.png"
          install -Dm644 configs/appimage/AppImage-runtime-NOTICE \
            "$appdir/usr/share/doc/gjoa/AppImage-runtime-NOTICE"
          install -Dm755 configs/appimage/AppRun "$appdir/AppRun"
          install -Dm644 configs/appimage/gjoa.desktop \
            "$appdir/usr/share/applications/gjoa.desktop"
          desktop-file-validate "$appdir/usr/share/applications/gjoa.desktop"

          ln -s ../lib/gjoa/gjoa "$appdir/usr/bin/gjoa"
          ln -s usr/share/applications/gjoa.desktop "$appdir/gjoa.desktop"
          ln -s usr/share/icons/hicolor/256x256/apps/gjoa.png "$appdir/gjoa.png"
          ln -s gjoa.png "$appdir/.DirIcon"

          tool="$tools_dir/appimagetool-${{ inputs.arch }}.AppImage"
          runtime="$tools_dir/runtime-${{ inputs.arch }}"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${{ inputs.arch }}.AppImage" \
            --output "$tool"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-${{ inputs.arch }}" \
            --output "$runtime"
          echo "$tool_sha  $tool" | sha256sum --check
          echo "$runtime_sha  $runtime" | sha256sum --check
          chmod +x "$tool"

          version="$(jq -r '.displayVersion' gjoa.json)"
          output="$output_dir/gjoa-${version}-${{ inputs.arch }}.AppImage"
          ARCH="${{ inputs.arch }}" APPIMAGE_EXTRACT_AND_RUN=1 \
            "$tool" --runtime-file "$runtime" "$appdir" "$output"
          chmod +x "$output"

          file "$output"
          file "$output" | grep -qi "$expected_arch"
          MOZ_HEADLESS=1 APPIMAGE_EXTRACT_AND_RUN=1 \
            timeout 120 "$output" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gjoa-linux-${{ inputs.arch }}
          # mach packages Linux as .tar.xz (not .bz2). Match any tarball, and
          # FAIL if none is found — a silent `warn` produced a green build with
          # no artifact, which is worse than a red build.
          path: |
            engine/obj-*/dist/gjoa-*.tar.*
            dist-packages/gjoa-*.AppImage
          if-no-files-found: error
